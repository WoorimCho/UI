spring.application.name=UI
server.port=8081

# Downstream services. Localhost defaults for dev; the compose/k8s service names override.
ingredient-catalogue.url=${INGREDIENT_CATALOGUE_URL:http://localhost:8082}
recipe-catalogue.url=${RECIPE_CATALOGUE_URL:http://localhost:8083}
user-service.url=${USER_SERVICE_URL:http://localhost:8084}
bff.url=${BFF_URL:http://localhost:8080}
recipe-crawler.url=${RECIPE_CRAWLER_URL:http://localhost:8086}

# Fail fast on a slow / dead downstream instead of hanging the page render.
# spring.http.clients.* (plural) is the Boot 4.1 key that feeds the shared
# HttpClientSettings -> the auto-configured RestClient.Builder (all four beans).
# Combined with the per-downstream circuit breakers in ClientConfig.
spring.http.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:8s}

# Thymeleaf: no template cache in dev.
spring.thymeleaf.cache=false

# Operations & tracing
management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# --- Inter-service auth (SECURITY.md C1/C2) ------------------------------------
# The UI signs its direct calls to the catalogues / User / crawler with an HMAC
# X-Internal-Auth header; acting user = the logged-in session's account id.
# No default (SECURITY.md N1): startup fails unless INTERNAL_AUTH_SECRET is at
# least 32 random characters - from the environment in containers, locally from
# the git-ignored .env in the project directory.
internal-auth.secret=${INTERNAL_AUTH_SECRET:}
spring.config.import=optional:file:.env[.properties]

# --- Session hardening (SECURITY.md M1) --------------------------------------
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
