<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container" style="max-width: 480px;">
    <div class="page-head"><h1>Create an account</h1></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/register}" method="post" class="stack">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" th:value="${username}" required minlength="3" maxlength="50">
                <div class="hint">3–50 characters.</div>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${email}" required>
            </div>
            <div class="field">
                <label for="displayName">Display name <span class="muted">(optional)</span></label>
                <input type="text" id="displayName" name="displayName" th:value="${displayName}">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8">
                <div class="hint">At least 8 characters.</div>
            </div>
            <button type="submit" class="btn">Create account</button>
        </form>
    </div>
    <p class="muted">Already have one? <a th:href="@{/login}">Sign in</a>.</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
